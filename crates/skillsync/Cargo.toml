[package]
name = "skillsync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.6"
cap-std = "4.0.2"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = "3.0.0"
filetime = "0.2.29"
getrandom = "0.4.3"
globset = "0.4.20"
humantime = "2.4.0"
humantime-serde = "1.1.1"
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-tickets = "1.0.0"
keyring = "4.1.6"
notify = { version = "8.2.0", default-features = false, features = ["macos_kqueue"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", default-features = false, features = ["parsing"] }
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread", "time", "sync", "io-util"] }
toml = "1.1.4"
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
iroh = { version = "1.0.3", features = ["portmapper", "test-utils", "tls-ring"], default-features = false }
tokio = { version = "1.47.1", features = ["net", "io-util", "test-util", "macros"], default-features = false }

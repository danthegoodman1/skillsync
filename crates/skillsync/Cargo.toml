[package]
name = "skillsync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.6"
cap-std = "4.0.2"
clap = { version = "4.6.6", features = ["derive"] }
ed25519-dalek = "3.0.0"
filetime = "0.2.29"
getrandom = "0.4.3"
globset = "0.4.20"
humantime = "2.4.0"
humantime-serde = "1.1.1"
iroh = "1.0.3"
keyring = "4.1.6"
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.4"
unicode-normalization = "0.1.25"
url = "2.5.8"

[dev-dependencies]
iroh = { version = "1.0.3", features = ["test-utils"] }
tokio = { version = "1.47.1", features = ["net", "io-util"] }
